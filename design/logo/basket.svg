<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <title>Optrolley: 2-opt basket</title>
  <!-- The basket's dashed crossbars are the crossed, worse tour; the solid rim is the uncrossed one 2-opt finds. -->
  <rect width="120" height="120" rx="28" fill="#0F6E56"/>
  <path d="M34 42 L92 72 M100 42 L42 72" fill="none" stroke="#5DCAA5" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M18 30 H30 L34 42 H100 L92 72 H42 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="50" cy="90" r="7" fill="#FFFFFF"/>
  <circle cx="86" cy="90" r="7" fill="#FFFFFF"/>
  <circle cx="34" cy="42" r="6" fill="#FAC775"/>
  <circle cx="100" cy="42" r="6" fill="#FAC775"/>
  <circle cx="92" cy="72" r="6" fill="#FAC775"/>
  <circle cx="42" cy="72" r="6" fill="#FAC775"/>
</svg>
